<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Scooter VS Arena</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0d1321;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-bar {
      background: #151e32;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.3px;
      color: #38bdf8;
    }

    .selectors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .select-box {
      background: #1e293b;
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .select-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .select-box label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
    }

    .selected-photo-badge {
      width: 44px;
      height: 44px;
      border-radius: 9px;
      background: #ffffff;
      border: 2px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .selected-photo-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    select, button, input[type="range"] {
      font-family: inherit;
    }

    select {
      width: 100%;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .arena-wrap {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #7dd3fc;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    canvas {
      display: block;
      width: 100%;
      height: 310px;
    }

    .controls {
      background: #151e32;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mode-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .mode-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9px;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .mode-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .sliders {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .slider-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 8px 10px;
    }

    .slider-head {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 4px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
    }

    .action-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }

    .start-btn {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #ffffff;
      border: none;
      border-radius: 11px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .reset-btn {
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 11px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .result-card {
      background: #151e32;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .result-title {
      font-size: 15px;
      font-weight: 800;
      color: #4ade80;
      margin-bottom: 6px;
    }

    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .spec-box {
      background: #1e293b;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      color: #e2e8f0;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .spec-thumb {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      background: #ffffff;
      object-fit: contain;
      flex-shrink: 0;
      padding: 2px;
    }

    .spec-name {
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <div class="brand">SCOOTER VS ARENA</div>
      <div class="selectors">
        <div class="select-box">
          <div class="select-head">
            <label for="s1">1. Scooter</label>
            <div class="selected-photo-badge">
              <img id="s1Thumb" alt="1. Scooter" />
            </div>
          </div>
          <select id="s1"></select>
        </div>
        <div class="select-box">
          <div class="select-head">
            <label for="s2">2. Scooter</label>
            <div class="selected-photo-badge">
              <img id="s2Thumb" alt="2. Scooter" />
            </div>
          </div>
          <select id="s2"></select>
        </div>
      </div>
    </div>

    <div class="arena-wrap">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls">
      <div class="mode-row">
        <button class="mode-btn active" data-mode="flat">Düz Yol (0°)</button>
        <button class="mode-btn" data-mode="hill">Dik Yokuş (18°)</button>
        <button class="mode-btn" data-mode="heavy">Yüklü Yokuş (22°)</button>
      </div>

      <div class="sliders">
        <div class="slider-card">
          <div class="slider-head">
            <span>Eğim</span>
            <span id="slopeVal">0°</span>
          </div>
          <input id="slopeInput" type="range" min="0" max="28" value="0" />
        </div>
        <div class="slider-card">
          <div class="slider-head">
            <span>Sürücü + Yük</span>
            <span id="loadVal">80 kg</span>
          </div>
          <input id="loadInput" type="range" min="50" max="160" value="80" />
        </div>
      </div>

      <div class="action-row">
        <button id="startBtn" class="start-btn">YARIŞI BAŞLAT</button>
        <button id="resetBtn" class="reset-btn">SIFIRLA</button>
      </div>
    </div>

    <div id="resultBox" class="result-card">
      <div class="result-title">Hazır! İstediğin 2 scooter'ı seç ve yarışı başlat.</div>
      <div>Pist uzunluğu: <strong>200 m</strong>. Güç (W), maksimum hız ve yük/eğim etkisi yarış sonucunu belirler.</div>
      <div id="specsGrid" class="specs-grid"></div>
    </div>
  </div>

        <svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120">
          <rect width="160" height="120" rx="12" fill="#ffffff"/>
          <ellipse cx="80" cy="102" rx="48" ry="6" fill="rgba(15,23,42,0.12)"/>
          ${hasBox ? `<rect x="26" y="54" width="24" height="18" rx="4" fill="#1e293b" stroke="${primaryColor}" stroke-width="2"/>` : ""}
          <!-- Arka teker -->
          <circle cx="38" cy="86" r="${wheelRadius + 5}" fill="#0f172a" stroke="${primaryColor}" stroke-width="3"/>
          <circle cx="38" cy="86" r="4" fill="#cbd5e1"/>
          <!-- Ön teker -->
          <circle cx="122" cy="86" r="${wheelRadius + 5}" fill="#0f172a" stroke="${primaryColor}" stroke-width="3"/>
          <circle cx="122" cy="86" r="4" fill="#cbd5e1"/>
          <!-- Süspansiyon kolları -->
          <path d="M38 86 L50 76 M122 86 L108 74" stroke="${accentColor}" stroke-width="4" stroke-linecap="round"/>
          <!-- Taban / Deck -->
          <rect x="34" y="72" width="76" height="9" rx="4.5" fill="#1e293b" stroke="${primaryColor}" stroke-width="2"/>
          <rect x="44" y="74" width="52" height="3" rx="1.5" fill="${primaryColor}"/>
          <!-- Gidon borusu -->
          <line x1="106" y1="74" x2="96" y2="26" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
          <line x1="106" y1="74" x2="96" y2="26" stroke="${primaryColor}" stroke-width="2" stroke-linecap="round"/>
          <!-- Gidon -->
          <path d="M88 26 L106 26 L112 30" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          ${dualMotor ? `<circle cx="38" cy="86" r="3" fill="${accentColor}"/><circle cx="122" cy="86" r="3" fill="${accentColor}"/>` : ""}
          <text x="80" y="16" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#334155" text-anchor="middle">${titleText}</text>
        </svg>
      `;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.trim());
    }

      {
        id: "tiger-supra",
        name: "Hiley Tiger Supra",
        powerW: 5200,
        topSpeedKmh: 100,
        battery: "60V/31.5Ah",
        rangeKm: 120,
        color: "#eab308",
        accent: "#fef08a",
        photo: makeScooterPhoto("#eab308", "#fef08a", 10, true, false, "TIGER SUPRA")
      }
    ];

    const TRACK_METERS = 200;
    const s1Select = document.getElementById("s1");
    const s2Select = document.getElementById("s2");
    const s1Thumb = document.getElementById("s1Thumb");
    const s2Thumb = document.getElementById("s2Thumb");
    const slopeInput = document.getElementById("slopeInput");
    const loadInput = document.getElementById("loadInput");
    const slopeVal = document.getElementById("slopeVal");
    const loadVal = document.getElementById("loadVal");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const resultBox = document.getElementById("resultBox");
    const modeBtns = document.querySelectorAll(".mode-btn");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Canvas içinde çizmek için scooter fotoğraflarını önbelleğe al
    const imageCache = new Map();
    function getCachedImage(scooter) {
      if (imageCache.has(scooter.id)) {
        return imageCache.get(scooter.id);
      }
      const img = new Image();
      img.src = scooter.photo;
      imageCache.set(scooter.id, img);
      return img;
    }

    SCOOTERS.forEach((sc, idx) => {
      getCachedImage(sc);
      const opt1 = new Option(`${sc.name} (${sc.powerW}W • ${sc.topSpeedKmh} km/h)`, sc.id);
      const opt2 = new Option(`${sc.name} (${sc.powerW}W • ${sc.topSpeedKmh} km/h)`, sc.id);
      s1Select.add(opt1);
      s2Select.add(opt2);
      if (idx === 0) s1Select.value = sc.id;
      if (idx === 1) s2Select.value = sc.id;
    });

    let raceState = {
      running: false,
      finished: false,
      elapsed: 0,
      racers: [
        { posM: 0, speedKmh: 0, finishTime: null },
        { posM: 0, speedKmh: 0, finishTime: null }
      ]
    };

    function getSelectedPair() {
      const a = SCOOTERS.find(x => x.id === s1Select.value) || SCOOTERS[0];
      const b = SCOOTERS.find(x => x.id === s2Select.value) || SCOOTERS[1];
      return [a, b];
    }

    function syncSelectorPhotos() {
      const [a, b] = getSelectedPair();
      s1Thumb.src = a.photo;
      s2Thumb.src = b.photo;
    }

    function renderSpecsSummary() {
      const [a, b] = getSelectedPair();
      const currentGrid = document.getElementById("specsGrid");
      if (!currentGrid) return;
      currentGrid.innerHTML = [a, b].map((sc, i) => `
        <div class="spec-box">
          <img class="spec-thumb" src="${sc.photo}" alt="${sc.name}" />
          <div>
            <div class="spec-name">${i + 1}. ${sc.name}</div>
            <div>Güç: <strong>${sc.powerW}W</strong> • Hız: <strong>${sc.topSpeedKmh} km/h</strong></div>
            <div>Pil: ${sc.battery} • Menzil: ${sc.rangeKm} km</div>
          </div>
        </div>
      `).join("");
    }

    function syncLabels() {
      slopeVal.textContent = `${slopeInput.value}°`;
      loadVal.textContent = `${loadInput.value} kg`;
    }

    function resetRace(keepMessage = false) {
      raceState.running = false;
      raceState.finished = false;
      raceState.elapsed = 0;
      raceState.racers = [
        { posM: 0, speedKmh: 0, finishTime: null },
        { posM: 0, speedKmh: 0, finishTime: null }
      ];
      startBtn.textContent = "YARIŞI BAŞLAT";
      syncSelectorPhotos();
      if (!keepMessage) {
        resultBox.innerHTML = `
          <div class="result-title">Hazır! İstediğin 2 scooter'ı seç ve yarışı başlat.</div>
          <div>Pist uzunluğu: <strong>200 m</strong>. Eğim: <strong>${slopeInput.value}°</strong> • Yük: <strong>${loadInput.value} kg</strong></div>
          <div id="specsGrid" class="specs-grid"></div>
        `;
        renderSpecsSummary();
      }
    }

    modeBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        modeBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const mode = btn.dataset.mode;
        if (mode === "flat") {
          slopeInput.value = 0;
          loadInput.value = 80;
        } else if (mode === "hill") {
          slopeInput.value = 18;
          loadInput.value = 85;
        } else if (mode === "heavy") {
          slopeInput.value = 22;
          loadInput.value = 135;
        }
        syncLabels();
        resetRace();
      });
    });

    slopeInput.addEventListener("input", () => {
      syncLabels();
      resetRace();
    });

    loadInput.addEventListener("input", () => {
      syncLabels();
      resetRace();
    });

    s1Select.addEventListener("change", () => resetRace());
    s2Select.addEventListener("change", () => resetRace());
    resetBtn.addEventListener("click", () => resetRace());

    startBtn.addEventListener("click", () => {
      if (raceState.running) return;
      resetRace(true);
      raceState.running = true;
      startBtn.textContent = "YARIŞ SÜRÜYOR...";
    });

    function computeTargetSpeed(scooter, slopeDeg, loadKg) {
      const loadFactor = Math.max(0.55, 1 - Math.max(0, loadKg - 70) * 0.003);
      const powerClimbBonus = Math.min(0.35, (scooter.powerW / 13000) * 0.35);
      const slopePenalty = (slopeDeg / 28) * Math.max(0.14, 0.52 - powerClimbBonus);
      const factor = Math.max(0.3, loadFactor * (1 - slopePenalty));
      return scooter.topSpeedKmh * factor;
    }

    function stepPhysics(dt) {
      if (!raceState.running) return;
      raceState.elapsed += dt;

      const pair = getSelectedPair();
      const slopeDeg = Number(slopeInput.value);
      const loadKg = Number(loadInput.value);

      pair.forEach((sc, idx) => {
        const r = raceState.racers[idx];
        if (r.finishTime !== null) return;

        const targetKmh = computeTargetSpeed(sc, slopeDeg, loadKg);
        const accelKmhPerSec = (12 + (sc.powerW / 13000) * 30) * Math.max(0.5, 1 - slopeDeg * 0.016);
        r.speedKmh = Math.min(targetKmh, r.speedKmh + accelKmhPerSec * dt);

        const metersPerSec = (r.speedKmh * 1000) / 3600;
        r.posM += metersPerSec * dt;

        if (r.posM >= TRACK_METERS) {
          r.posM = TRACK_METERS;
          r.finishTime = raceState.elapsed;
        }
      });

      const [r1, r2] = raceState.racers;
      if (r1.finishTime !== null && r2.finishTime !== null) {
        raceState.running = false;
        raceState.finished = true;
        startBtn.textContent = "TEKRAR YARIŞTIR";

        const [a, b] = pair;
        const firstIsA = r1.finishTime <= r2.finishTime;
        const winner = firstIsA ? a : b;
        const loser = firstIsA ? b : a;
        const diff = Math.abs(r1.finishTime - r2.finishTime).toFixed(2);

        resultBox.innerHTML = `
          <div class="result-title">Kazanan: ${winner.name} (${diff} sn farkla)</div>
          <div>
            <strong>1. ${winner.name}:</strong> ${(firstIsA ? r1.finishTime : r2.finishTime).toFixed(2)} sn •
            <strong>2. ${loser.name}:</strong> ${(firstIsA ? r2.finishTime : r1.finishTime).toFixed(2)} sn
          </div>
          <div id="specsGrid" class="specs-grid"></div>
        `;
        renderSpecsSummary();
      }
    }

    function drawScooterPhoto(x, y, scooter, labelNum) {
      ctx.save();
      ctx.translate(x, y);

      const boxW = 54;
      const boxH = 42;
      const left = -boxW / 2;
      const top = -boxH / 2 - 4;

      // Gölge
      ctx.fillStyle = "rgba(0, 0, 0, 0.32)";
      ctx.beginPath();
      ctx.ellipse(0, top + boxH + 3, 24, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Beyaz kart çerçevesi
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = scooter.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(left, top, boxW, boxH, 8);
      ctx.fill();
      ctx.stroke();

      // Scooter fotoğrafı
      const img = getCachedImage(scooter);
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, left + 3, top + 3, boxW - 6, boxH - 6);
      }

      // 1 veya 2 numara rozeti
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(left + 7, top + 7, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(labelNum), left + 7, top + 7);

      ctx.restore();
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function renderScene() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const slopeDeg = Number(slopeInput.value);
      const pair = getSelectedPair();

      const sky = ctx.createLinearGradient(0, 0, 0, h * 0.56);
      sky.addColorStop(0, "#38bdf8");
      sky.addColorStop(1, "#bae6fd");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h * 0.56);

      ctx.fillStyle = "#0284c7";
      ctx.beginPath();
      ctx.moveTo(0, h * 0.56);
      ctx.lineTo(w * 0.25, h * 0.39);
      ctx.lineTo(w * 0.55, h * 0.52);
      ctx.lineTo(w * 0.82, h * 0.37);
      ctx.lineTo(w, h * 0.50);
      ctx.lineTo(w, h * 0.56);
      ctx.closePath();
      ctx.fill();

      const tilt = Math.tan((slopeDeg * Math.PI) / 180) * 32;
      ctx.fillStyle = "#1e293b";
      ctx.beginPath();
      ctx.moveTo(0, h * 0.53 + tilt * 0.35);
      ctx.lineTo(w, h * 0.53 - tilt * 0.35);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();

      const lane1Y = h * 0.68;
      const lane2Y = h * 0.87;

      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 10]);
      ctx.beginPath();
      ctx.moveTo(16, (lane1Y + lane2Y) / 2);
      ctx.lineTo(w - 16, (lane1Y + lane2Y) / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      const startX = 56;
      const finishX = w - 42;
      const trackSpan = Math.max(40, finishX - startX);

      ctx.strokeStyle = "#f8fafc";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(startX, h * 0.55);
      ctx.lineTo(startX, h - 8);
      ctx.stroke();

      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(finishX, h * 0.55);
      ctx.lineTo(finishX, h - 8);
      ctx.stroke();

      ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
      ctx.fillRect(10, 10, w - 20, 30);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(
        `Süre: ${raceState.elapsed.toFixed(1)}s  |  Eğim: ${slopeDeg}°  |  Yük: ${loadInput.value} kg`,
        18,
        25
      );

      [lane1Y, lane2Y].forEach((laneY, idx) => {
        const r = raceState.racers[idx];
        const ratio = Math.min(1, r.posM / TRACK_METERS);
        const x = startX + ratio * trackSpan;

        ctx.fillStyle = "#cbd5e1";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`${pair[idx].name} • ${Math.round(r.speedKmh)} km/h • ${Math.round(r.posM)}m`, 14, laneY - 28);

        drawScooterPhoto(x, laneY, pair[idx], idx + 1);
      });
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      stepPhysics(dt);
      renderScene();
      requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    syncLabels();
    syncSelectorPhotos();
    renderSpecsSummary();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
