<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Scooter Ride & Missions</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-top {
      background: #131c31;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .title-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .brand {
      font-size: 16px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.4px;
    }

    .pill {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 700;
      color: #f8fafc;
    }

    .pill.money {
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.35);
    }

    .npc-control {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .npc-control input[type="range"] {
      width: 78px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .map-switch {
      display: flex;
      gap: 6px;
    }

    .map-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .map-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .road-wrap {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #0f172a;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
    }

    canvas {
      display: block;
      width: 100%;
      height: 360px;
    }

    .mission-banner {
      background: #131c31;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 9px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }

    .mission-text strong {
      color: #38bdf8;
    }

    .banner-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sound-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .drive-controls {
      background: #131c31;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .lane-pad, .pedal-pad {
      display: grid;
      gap: 8px;
    }

    .lane-pad {
      grid-template-columns: 1fr 1fr;
    }

    .pedal-pad {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .ctrl-btn {
      border: none;
      border-radius: 12px;
      padding: 13px 8px;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      touch-action: manipulation;
    }

    .ctrl-btn:active, .ctrl-btn.pressed {
      transform: scale(0.97);
      filter: brightness(1.15);
    }

    .btn-lane {
      background: #2563eb;
    }

    .btn-gas {
      background: linear-gradient(135deg, #15803d, #22c55e);
    }

    .btn-brake {
      background: linear-gradient(135deg, #b91c1c, #ef4444);
    }

    .btn-horn {
      background: linear-gradient(135deg, #d97706, #f59e0b);
    }

    .garage-section {
      background: #131c31;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .garage-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .garage-title {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
    }

    .garage-sub {
      font-size: 11px;
      color: #94a3b8;
    }

    .scooter-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 8px;
      max-height: 310px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .scooter-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 11px;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .scooter-card.active {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.35);
    }

    .scooter-rank {
      font-size: 10px;
      font-weight: 800;
      color: #fbbf24;
      text-transform: uppercase;
    }

    .scooter-name {
      font-size: 12px;
      font-weight: 800;
      color: #f8fafc;
      margin-top: 2px;
    }

    .scooter-meta {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .price-tag {
      font-size: 12px;
      font-weight: 800;
      color: #4ade80;
    }

    .owned-tag {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
    }

    .action-mini {
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-buy {
      background: #16a34a;
      color: #ffffff;
    }

    .btn-buy:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-select {
      background: #0284c7;
      color: #ffffff;
    }

    @media (max-width: 680px) {
      .drive-controls {
        grid-template-columns: 1fr;
      }
      canvas {
        height: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hud-top">
      <div class="title-group">
        <div class="brand">SCOOTER RIDE</div>
        <div id="moneyPill" class="pill money">₺15.000,00</div>
        <div id="activeScooterPill" class="pill">Araç: -</div>
        <label class="npc-control" title="Trafikteki NPC yoğunluğunu ayarla">
          <span>NPC:</span>
          <input id="npcDensitySlider" type="range" min="0" max="100" step="10" value="50" />
          <span id="npcDensityLabel">Normal (%50)</span>
        </label>
      </div>
      <div class="map-switch">
        <button id="freeMapBtn" class="map-btn active" type="button">Serbest Harita</button>
        <button id="missionMapBtn" class="map-btn" type="button">Görev Haritası</button>
      </div>
    </div>

    <div class="road-wrap">
      <canvas id="roadCanvas"></canvas>
    </div>

    <div class="mission-banner">
      <div id="missionText" class="mission-text">
        <strong>Serbest Harita:</strong> 2 şeritli yolda serbest sürüş yap. Şerit: A/D veya ←/→ • Gaz: W/↑ • Fren: S/↓ • Korna: H
      </div>
      <div class="banner-actions">
        <button id="soundToggleBtn" class="sound-btn" type="button">Ses: Açık</button>
      </div>
    </div>

    <div class="drive-controls">
      <div class="lane-pad">
        <button id="leftLaneBtn" class="ctrl-btn btn-lane" type="button">◀ SOL ŞERİT</button>
        <button id="rightLaneBtn" class="ctrl-btn btn-lane" type="button">SAĞ ŞERİT ▶</button>
      </div>
      <div class="pedal-pad">
        <button id="gasBtn" class="ctrl-btn btn-gas" type="button">GAZ</button>
        <button id="brakeBtn" class="ctrl-btn btn-brake" type="button">FREN</button>
        <button id="hornBtn" class="ctrl-btn btn-horn" type="button">KORNA</button>
      </div>
    </div>

    <div class="garage-section">
      <div class="garage-head">
        <div class="garage-title">Scooter Mağazası &amp; Garaj (İyiden Kötüye Sıralı)</div>
        <div class="garage-sub">Kazandığın scooterlar otomatik kaydedilir • Başlangıçta 1. model açık</div>
      </div>
      <div id="scooterList" class="scooter-list"></div>
    </div>
  </div>

  <script>
    const SAVE_KEY = "scooter_ride_save_v2";

    // Görsellerdeki fiyatlarla güncellenmiş scooter listesi
    const RAW_SCOOTERS = [
      { id: "x-limited", name: "Dualtron X Limited", price: 339900, powerW: 13000, topSpeedKmh: 130, battery: "84V 60A", rangeKm: 170, color: "#8b5cf6" },
      { id: "sonic-alien", name: "Dualtron Sonic Alien", price: 239900, powerW: 11800, topSpeedKmh: 120, battery: "72V 40A", rangeKm: 120, color: "#f97316" },
      { id: "thunder-3", name: "Dualtron Thunder 3", price: 231900, powerW: 10800, topSpeedKmh: 110, battery: "72V 40A", rangeKm: 120, color: "#6366f1" },
      { id: "tiger-supra", name: "Hiley Tiger Supra", price: 164900, powerW: 5200, topSpeedKmh: 100, battery: "60V/31.5Ah", rangeKm: 120, color: "#eab308" },
      { id: "achilleus", name: "Dualtron Achilleus", price: 164700, powerW: 4650, topSpeedKmh: 80, battery: "60V 35A", rangeKm: 100, color: "#10b981" },
      { id: "victor-limited", name: "Dualtron Victor Limited", price: 139900, powerW: 4300, topSpeedKmh: 80, battery: "60V 35A", rangeKm: 100, color: "#0ea5e9" },
      { id: "tiger-10-gtr", name: "Hiley Tiger 10 GTR", price: 95000, powerW: 4000, topSpeedKmh: 90, battery: "60V/23.4Ah", rangeKm: 90, color: "#f97316" },
      { id: "rx07", name: "Onvo RX-07 Elektrikli", price: 53000, powerW: 4000, topSpeedKmh: 80, battery: "60V 25A", rangeKm: 70, color: "#ef4444" },
      { id: "city-new", name: "Dualtron City New", price: 134900, powerW: 4000, topSpeedKmh: 70, battery: "60V 25A", rangeKm: 70, color: "#f43f5e" },
      { id: "rx10", name: "ONVO RX-10 3000W", price: 73990, powerW: 3000, topSpeedKmh: 80, battery: "60.8V 21.8A", rangeKm: 80, color: "#06b6d4" },
      { id: "rovoron-r7", name: "Rovoron R7 Elektrikli", price: 98900, powerW: 3000, topSpeedKmh: 80, battery: "60V 42.4A", rangeKm: 120, color: "#14b8a6" },
      { id: "tiger-10-v4", name: "Hiley Tiger 10 V4", price: 104999, powerW: 3000, topSpeedKmh: 70, battery: "52V 21A", rangeKm: 80, color: "#f59e0b" },
      { id: "rx09-3000", name: "ONVO RX-09 3000W", price: 64999, powerW: 3000, topSpeedKmh: 65, battery: "60V 20A", rangeKm: 8, color: "#2563eb" },
      { id: "togo-limited", name: "Dualtron Togo Limited", price: 69900, powerW: 2900, topSpeedKmh: 60, battery: "60V 15A", rangeKm: 60, color: "#14b8a6" },
      { id: "aminia-long", name: "Dualtron Aminia Long", price: 72900, powerW: 2900, topSpeedKmh: 60, battery: "52V 21A", rangeKm: 60, color: "#22c55e" },
      { id: "rx05", name: "Onvo RX-05 Elektrikli", price: 47000, powerW: 2400, topSpeedKmh: 75, battery: "60V 25A", rangeKm: 60, color: "#22c55e" },
      { id: "mx03", name: "ONVO Mx-03 2400W", price: 53999, powerW: 2400, topSpeedKmh: 65, battery: "52V 20A", rangeKm: 70, color: "#06b6d4" },
      { id: "rx04", name: "Onvo RX-04 Elektrikli", price: 62999, powerW: 2400, topSpeedKmh: 65, battery: "52V 21A", rangeKm: 60, color: "#ef4444" },
      { id: "tiger-10-v3", name: "Hiley Tiger 10 V3", price: 71999, powerW: 2000, topSpeedKmh: 65, battery: "52V/20.8Ah", rangeKm: 75, color: "#eab308" },
      { id: "ov-013-x-plus", name: "ONVO OV-013 X-Plus", price: 41990, powerW: 2000, topSpeedKmh: 65, battery: "48V 18A", rangeKm: 60, color: "#eab308" },
      { id: "segway-max-g3", name: "Segway Ninebot Max G3", price: 64999, powerW: 2000, topSpeedKmh: 45, battery: "48V 12.5Ah", rangeKm: 80, color: "#dc2626" },
      { id: "tiger-max-gtr", name: "Hiley Tiger Max Gtr", price: 58000, powerW: 1600, topSpeedKmh: 55, battery: "48V/18.2Ah", rangeKm: 60, color: "#a855f7" },
      { id: "mx02", name: "ONVO Mx-02 1600W", price: 44999, powerW: 1600, topSpeedKmh: 55, battery: "52V 15A", rangeKm: 60, color: "#f59e0b" },
      { id: "ov-012-x-plus", name: "Onvo OV-012 X Plus", price: 36999, powerW: 1600, topSpeedKmh: 50, battery: "48V 15A", rangeKm: 50, color: "#a855f7" },
      { id: "segway-zt3-pro", name: "Segway-Ninebot ZT3 Pro", price: 51269, powerW: 1600, topSpeedKmh: 40, battery: "46V 12.8Ah", rangeKm: 70, color: "#ef4444" },
      { id: "togo-plus", name: "Dualtron Togo Plus", price: 48900, powerW: 1350, topSpeedKmh: 40, battery: "48V 15A", rangeKm: 40, color: "#84cc16" },
      { id: "segway-f3-pro", name: "Segway Ninebot F3 Pro", price: 39999, powerW: 1200, topSpeedKmh: 35, battery: "46V 10.2Ah", rangeKm: 70, color: "#e11d48" },
      { id: "mx01", name: "ONVO Mx-01 800W", price: 28999, powerW: 800, topSpeedKmh: 50, battery: "48V 13A", rangeKm: 55, color: "#ec4899" },
      { id: "ov-12", name: "Onvo OV-12 Elektrikli", price: 28500, powerW: 800, topSpeedKmh: 50, battery: "48V 10A", rangeKm: 40, color: "#10b981" },
      { id: "segway-e3-pro", name: "Segway-Ninebot E3 Pro", price: 28999, powerW: 800, topSpeedKmh: 32, battery: "36V 10.2Ah", rangeKm: 55, color: "#64748b" },
      { id: "ov-008", name: "ONVO OV-008 500W", price: 23999, powerW: 500, topSpeedKmh: 35, battery: "Belirtilmemiş", rangeKm: 30, color: "#38bdf8" },
      { id: "ov-007-x", name: "Onvo Ov-007 X Elektrikli", price: 22500, powerW: 500, topSpeedKmh: 35, battery: "Belirtilmemiş", rangeKm: 30, color: "#6366f1" },
      { id: "kx-02", name: "Onvo KX-02 Elektrikli", price: 14900, powerW: 200, topSpeedKmh: 16, battery: "21.6V 5.2A", rangeKm: 15, color: "#e11d48" },
      { id: "kx-01k", name: "ONVO KX-01K 150W", price: 9999, powerW: 150, topSpeedKmh: 15, battery: "21.6V 2.4A", rangeKm: 8, color: "#f43f5e" }
    ];

    const SCOOTERS = RAW_SCOOTERS
      .map(s => ({
        ...s,
        score: s.powerW * 1.4 + s.topSpeedKmh * 180
      }))
      .sort((a, b) => b.score - a.score)
      .map((s, idx) => ({
        ...s,
        rank: idx + 1
      }));

    const starterScooter = SCOOTERS[SCOOTERS.length - 1];
    const validScooterIds = new Set(SCOOTERS.map(s => s.id));

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return null;

        const savedOwned = Array.isArray(parsed.ownedIds)
          ? parsed.ownedIds.filter(id => validScooterIds.has(id))
          : [];
        if (!savedOwned.includes(starterScooter.id)) {
          savedOwned.push(starterScooter.id);
        }

        const savedSelected = validScooterIds.has(parsed.selectedId) && savedOwned.includes(parsed.selectedId)
          ? parsed.selectedId
          : (savedOwned[0] || starterScooter.id);

        return {
          money: typeof parsed.money === "number" && Number.isFinite(parsed.money) ? Math.max(0, parsed.money) : 15000,
          ownedIds: new Set(savedOwned),
          selectedId: savedSelected,
          npcDensity: typeof parsed.npcDensity === "number" ? Math.max(0, Math.min(100, parsed.npcDensity)) : 50,
          soundEnabled: typeof parsed.soundEnabled === "boolean" ? parsed.soundEnabled : true,
          completedCount: typeof parsed.completedCount === "number" ? Math.max(0, parsed.completedCount) : 0
        };
      } catch (_) {
        return null;
      }
    }

    const saved = loadSavedState();

    const state = {
      money: saved ? saved.money : 15000,
      ownedIds: saved ? saved.ownedIds : new Set([starterScooter.id]),
      selectedId: saved ? saved.selectedId : starterScooter.id,
      mapMode: "free",
      soundEnabled: saved ? saved.soundEnabled : true,
      npcDensity: saved ? saved.npcDensity : 50,
      lane: 1,
      laneVisualX: 1,
      speedKmh: 0,
      distanceM: 0,
      roadOffset: 0,
      controls: {
        gas: false,
        brake: false
      },
      npcs: [],
      mission: {
        active: true,
        type: "checkpoint",
        targetM: 220,
        reward: 3500,
        completedCount: saved ? saved.completedCount : 0,
        statusText: "Kontrol noktasına ulaş (220m)"
      },
      flashMessage: "",
      flashTimer: 0
    };

    function saveProgress() {
      try {
        const payload = {
          money: state.money,
          ownedIds: Array.from(state.ownedIds),
          selectedId: state.selectedId,
          npcDensity: state.npcDensity,
          soundEnabled: state.soundEnabled,
          completedCount: state.mission.completedCount
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
      } catch (_) {}
    }

    const audioCtxHolder = {
      ctx: null,
      motorOsc: null,
      motorSubOsc: null,
      motorGain: null
    };

    function ensureAudio() {
      if (!state.soundEnabled) return;
      if (!audioCtxHolder.ctx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        const osc = ctx.createOscillator();
        const subOsc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "triangle";
        subOsc.type = "sine";
        osc.frequency.value = 75;
        subOsc.frequency.value = 150;

        gain.gain.value = 0.0001;
        osc.connect(gain);
        subOsc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        subOsc.start();

        audioCtxHolder.ctx = ctx;
        audioCtxHolder.motorOsc = osc;
        audioCtxHolder.motorSubOsc = subOsc;
        audioCtxHolder.motorGain = gain;
      }
      if (audioCtxHolder.ctx && audioCtxHolder.ctx.state === "suspended") {
        audioCtxHolder.ctx.resume().catch(() => {});
      }
    }

    function updateMotorSound(speedRatio, isGas, isBrake) {
      if (!audioCtxHolder.ctx || !audioCtxHolder.motorGain) return;
      const now = audioCtxHolder.ctx.currentTime;
      if (!state.soundEnabled) {
        audioCtxHolder.motorGain.gain.setTargetAtTime(0.0001, now, 0.05);
        return;
      }
      const baseFreq = 70 + speedRatio * 230 + (isGas ? 22 : 0);
      audioCtxHolder.motorOsc.frequency.setTargetAtTime(baseFreq, now, 0.06);
      audioCtxHolder.motorSubOsc.frequency.setTargetAtTime(baseFreq * 2, now, 0.06);

      const targetGain = speedRatio > 0.02 || isGas ? Math.min(0.08, 0.015 + speedRatio * 0.055 + (isGas ? 0.015 : 0)) : 0.0001;
      audioCtxHolder.motorGain.gain.setTargetAtTime(targetGain * (isBrake ? 0.65 : 1), now, 0.06);
    }

    function playBrakeSound() {
      if (!state.soundEnabled) return;
      ensureAudio();
      if (!audioCtxHolder.ctx) return;
      const ctx = audioCtxHolder.ctx;
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(160, now + 0.16);

      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.17);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }

    function playHornSound() {
      if (!state.soundEnabled) return;
      ensureAudio();
      if (!audioCtxHolder.ctx) return;
      const ctx = audioCtxHolder.ctx;
      const now = ctx.currentTime;

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();

      osc1.type = "square";
      osc2.type = "sawtooth";
      osc1.frequency.setValueAtTime(440, now);
      osc2.frequency.setValueAtTime(554.37, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.065, now + 0.02);
      gain.gain.setValueAtTime(0.065, now + 0.22);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.34);
      osc2.stop(now + 0.34);

      state.npcs.forEach(npc => {
        if (npc.y > 40 && npc.y < 230 && Math.abs(npc.lane - state.lane) <= 1) {
          npc.honked = true;
          npc.speed = Math.min(npc.maxSpeed + 22, npc.speed + 18);
        }
      });
    }

    function getCurrentScooter() {
      return SCOOTERS.find(s => s.id === state.selectedId) || SCOOTERS[0];
    }

    function formatMoney(val) {
      return "₺" + Number(val).toLocaleString("tr-TR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function showToast(msg) {
      state.flashMessage = msg;
      state.flashTimer = 2.2;
    }

    function getNpcDensityText(val) {
      if (val === 0) return "Kapalı (%0)";
      if (val <= 30) return `Az (%${val})`;
      if (val <= 70) return `Normal (%${val})`;
      return `Çok (%${val})`;
    }

    const npcDensitySlider = document.getElementById("npcDensitySlider");
    const npcDensityLabel = document.getElementById("npcDensityLabel");

    function syncNpcControlUI() {
      npcDensitySlider.value = String(state.npcDensity);
      npcDensityLabel.textContent = getNpcDensityText(state.npcDensity);
    }

    npcDensitySlider.addEventListener("input", () => {
      state.npcDensity = Number(npcDensitySlider.value);
      syncNpcControlUI();

      if (state.npcDensity === 0) {
        state.npcs = [];
      } else {
        const maxAllowed = Math.max(1, Math.round((state.npcDensity / 100) * 10));
        if (state.npcs.length > maxAllowed) {
          state.npcs = state.npcs.slice(0, maxAllowed);
        }
      }
      saveProgress();
    });

    function assignNextMission() {
      const mIndex = state.mission.completedCount;
      const isSpeedMission = mIndex % 2 === 1;
      if (isSpeedMission) {
        const minSpeed = Math.min(85, Math.max(22, Math.round(getCurrentScooter().topSpeedKmh * 0.65)));
        const reward = 4200 + mIndex * 1000;
        state.mission = {
          active: true,
          type: "speed_pass",
          targetM: state.distanceM + 260,
          minSpeedKmh: minSpeed,
          reward,
          completedCount: mIndex,
          statusText: `260m boyunca en az ${minSpeed} km/h hızla sür`
        };
      } else {
        const reward = 3500 + mIndex * 900;
        state.mission = {
          active: true,
          type: "checkpoint",
          targetM: state.distanceM + 220,
          reward,
          completedCount: mIndex,
          statusText: "Kontrol noktasına ulaş (220m)"
        };
      }
      updateMissionUI();
    }

    function updateMissionUI() {
      const el = document.getElementById("missionText");
      if (state.mapMode === "free") {
        el.innerHTML = `<strong>Serbest Harita:</strong> 2 şeritli yolda NPC'ler arasında serbest sürüş. Şerit: A/D veya ←/→ • Gaz: W/↑ • Fren: S/↓ • Korna: H`;
      } else {
        const remaining = Math.max(0, Math.round(state.mission.targetM - state.distanceM));
        el.innerHTML = `<strong>Görev Haritası (${state.mission.statusText}):</strong> Kalan mesafe <strong>${remaining}m</strong> • Ödül: <strong>${formatMoney(state.mission.reward)}</strong> • Tamamlanan: <strong>${state.mission.completedCount}</strong>`;
      }
    }

    function renderHUD() {
      const sc = getCurrentScooter();
      document.getElementById("moneyPill").textContent = formatMoney(state.money);
      document.getElementById("activeScooterPill").textContent = `Araç: #${sc.rank} ${sc.name} (${sc.powerW}W)`;
      updateMissionUI();
    }

    function renderGarage() {
      const listEl = document.getElementById("scooterList");
      listEl.innerHTML = SCOOTERS.map(sc => {
        const owned = state.ownedIds.has(sc.id);
        const isSelected = state.selectedId === sc.id;
        const canAfford = state.money >= sc.price;

        let btnHtml = "";
        if (isSelected) {
          btnHtml = `<span class="owned-tag">Sürülüyor</span>`;
        } else if (owned) {
          btnHtml = `<button class="action-mini btn-select" onclick="selectScooter('${sc.id}')">Seç</button>`;
        } else {
          btnHtml = `<button class="action-mini btn-buy" ${canAfford ? "" : "disabled"} onclick="buyScooter('${sc.id}')">Satın Al</button>`;
        }

        return `
          <div class="scooter-card ${isSelected ? "active" : ""}">
            <div>
              <div class="scooter-rank">Sıra #${sc.rank} • ${sc.powerW}W • ${sc.topSpeedKmh} km/h</div>
              <div class="scooter-name">${sc.name}</div>
              <div class="scooter-meta">Pil: ${sc.battery} • Menzil: ${sc.rangeKm} km</div>
            </div>
            <div class="card-footer">
              <div class="price-tag">${owned ? "Sahip Olunan" : formatMoney(sc.price)}</div>
              ${btnHtml}
            </div>
          </div>
        `;
      }).join("");
    }

    window.buyScooter = function(id) {
      ensureAudio();
      const sc = SCOOTERS.find(s => s.id === id);
      if (!sc || state.ownedIds.has(id)) return;
      if (state.money < sc.price) {
        showToast("Yetersiz bakiye! Görev yaparak para kazan.");
        return;
      }
      state.money -= sc.price;
      state.ownedIds.add(id);
      state.selectedId = id;
      state.speedKmh = Math.min(state.speedKmh, sc.topSpeedKmh);
      saveProgress();
      showToast(`${sc.name} satın alındı ve kaydedildi!`);
      renderHUD();
      renderGarage();
    };

    window.selectScooter = function(id) {
      ensureAudio();
      if (!state.ownedIds.has(id)) return;
      const sc = SCOOTERS.find(s => s.id === id);
      state.selectedId = id;
      state.speedKmh = Math.min(state.speedKmh, sc.topSpeedKmh);
      saveProgress();
      showToast(`${sc.name} seçildi.`);
      renderHUD();
      renderGarage();
    };

    const freeMapBtn = document.getElementById("freeMapBtn");
    const missionMapBtn = document.getElementById("missionMapBtn");

    freeMapBtn.addEventListener("click", () => {
      ensureAudio();
      state.mapMode = "free";
      freeMapBtn.classList.add("active");
      missionMapBtn.classList.remove("active");
      renderHUD();
    });

    missionMapBtn.addEventListener("click", () => {
      ensureAudio();
      state.mapMode = "mission";
      missionMapBtn.classList.add("active");
      freeMapBtn.classList.remove("active");
      assignNextMission();
      renderHUD();
    });

    const soundBtn = document.getElementById("soundToggleBtn");
    function syncSoundBtnUI() {
      soundBtn.textContent = state.soundEnabled ? "Ses: Açık" : "Ses: Kapalı";
    }
    soundBtn.addEventListener("click", () => {
      state.soundEnabled = !state.soundEnabled;
      syncSoundBtnUI();
      saveProgress();
      if (state.soundEnabled) ensureAudio();
    });

    function changeLane(targetLane) {
      ensureAudio();
      const clamped = Math.max(0, Math.min(1, targetLane));
      if (clamped !== state.lane) {
        state.lane = clamped;
      }
    }

    document.getElementById("leftLaneBtn").addEventListener("click", () => changeLane(0));
    document.getElementById("rightLaneBtn").addEventListener("click", () => changeLane(1));

    const gasBtn = document.getElementById("gasBtn");
    const brakeBtn = document.getElementById("brakeBtn");
    const hornBtn = document.getElementById("hornBtn");

    function bindHold(btn, prop, onPressExtra) {
      const press = (e) => {
        e.preventDefault();
        ensureAudio();
        state.controls[prop] = true;
        btn.classList.add("pressed");
        if (onPressExtra) onPressExtra();
      };
      const release = () => {
        state.controls[prop] = false;
        btn.classList.remove("pressed");
      };
      btn.addEventListener("pointerdown", press);
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointerleave", release);
      btn.addEventListener("pointercancel", release);
    }

    bindHold(gasBtn, "gas", null);
    bindHold(brakeBtn, "brake", playBrakeSound);
    hornBtn.addEventListener("click", () => {
      hornBtn.classList.add("pressed");
      playHornSound();
      setTimeout(() => hornBtn.classList.remove("pressed"), 180);
    });

    window.addEventListener("keydown", (e) => {
      ensureAudio();
      if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") {
        state.controls.gas = true;
        gasBtn.classList.add("pressed");
      } else if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") {
        if (!state.controls.brake) playBrakeSound();
        state.controls.brake = true;
        brakeBtn.classList.add("pressed");
      } else if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") {
        changeLane(0);
      } else if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") {
        changeLane(1);
      } else if (e.key === "h" || e.key === "H") {
        playHornSound();
        hornBtn.classList.add("pressed");
        setTimeout(() => hornBtn.classList.remove("pressed"), 180);
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") {
        state.controls.gas = false;
        gasBtn.classList.remove("pressed");
      } else if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") {
        state.controls.brake = false;
        brakeBtn.classList.remove("pressed");
      }
    });

    const NPC_COLORS = ["#f97316", "#06b6d4", "#eab308", "#ec4899", "#a855f7", "#10b981"];

    function spawnNpc() {
      if (state.npcDensity <= 0) return;

      const maxActiveNpcs = Math.max(1, Math.round((state.npcDensity / 100) * 10));
      if (state.npcs.length >= maxActiveNpcs) return;

      const minGapY = Math.max(68, 175 - state.npcDensity * 1.05);
      const lane = Math.random() < 0.5 ? 0 : 1;
      const sameLaneTooClose = state.npcs.some(n => n.lane === lane && n.y < minGapY);
      if (sameLaneTooClose) return;

      const maxSpeed = 35 + Math.random() * 45;
      state.npcs.push({
        lane,
        y: -45,
        speed: maxSpeed * 0.75,
        maxSpeed,
        color: NPC_COLORS[Math.floor(Math.random() * NPC_COLORS.length)],
        honked: false
      });
    }

    const canvas = document.getElementById("roadCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function step(dt) {
      const sc = getCurrentScooter();
      const accelRate = 18 + (sc.powerW / 13000) * 44;
      const brakeRate = 58;
      const coastDrag = 10;

      if (state.controls.gas && !state.controls.brake) {
        state.speedKmh = Math.min(sc.topSpeedKmh, state.speedKmh + accelRate * dt);
      } else if (state.controls.brake) {
        state.speedKmh = Math.max(0, state.speedKmh - brakeRate * dt);
      } else {
        state.speedKmh = Math.max(0, state.speedKmh - coastDrag * dt);
      }

      const speedMps = (state.speedKmh * 1000) / 3600;
      const deltaM = speedMps * dt;
      state.distanceM += deltaM;
      state.roadOffset = (state.roadOffset + deltaM * 18) % 80;

      state.laneVisualX += (state.lane - state.laneVisualX) * Math.min(1, dt * 13);

      if (state.npcDensity > 0) {
        const spawnRatePerSec = (state.npcDensity / 100) * 3.2;
        if (Math.random() < dt * spawnRatePerSec) {
          spawnNpc();
        }
      }

      const playerY = canvas.getBoundingClientRect().height * 0.74;
      state.npcs.forEach(npc => {
        npc.speed = Math.min(npc.maxSpeed, npc.speed + 8 * dt);
        const relSpeedMps = ((state.speedKmh - npc.speed) * 1000) / 3600;
        npc.y += relSpeedMps * dt * 16 + 35 * dt;

        if (Math.abs(npc.lane - state.laneVisualX) < 0.35 && Math.abs(npc.y - playerY) < 34) {
          if (state.speedKmh > npc.speed + 8) {
            state.speedKmh = Math.max(0, npc.speed * 0.75);
            showToast("NPC araca çarptın! Hız düştü.");
          }
        }
      });

      state.npcs = state.npcs.filter(n => n.y > -120 && n.y < canvas.getBoundingClientRect().height + 120);

      if (state.mapMode === "mission" && state.mission.active) {
        if (state.distanceM >= state.mission.targetM) {
          const earned = state.mission.reward;
          state.money += earned;
          state.mission.completedCount += 1;
          saveProgress();
          showToast(`Görev tamamlandı! +${formatMoney(earned)} kazandın!`);
          assignNextMission();
          renderGarage();
        }
        updateMissionUI();
      }

      if (state.flashTimer > 0) {
        state.flashTimer = Math.max(0, state.flashTimer - dt);
        if (state.flashTimer === 0) state.flashMessage = "";
      }

      document.getElementById("moneyPill").textContent = formatMoney(state.money);
      updateMotorSound(state.speedKmh / Math.max(1, sc.topSpeedKmh), state.controls.gas, state.controls.brake);
    }

    function drawRoad() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const sc = getCurrentScooter();

      ctx.fillStyle = state.mapMode === "mission" ? "#101c2e" : "#0f172a";
      ctx.fillRect(0, 0, w, h);

      const roadW = Math.min(340, w * 0.72);
      const roadLeft = (w - roadW) / 2;
      const roadRight = roadLeft + roadW;
      const laneW = roadW / 2;

      ctx.fillStyle = state.mapMode === "mission" ? "#134e4a" : "#14532d";
      ctx.fillRect(0, 0, roadLeft, h);
      ctx.fillRect(roadRight, 0, w - roadRight, h);

      ctx.fillStyle = "#1e293b";
      ctx.fillRect(roadLeft, 0, roadW, h);

      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(roadLeft, 0, 5, h);
      ctx.fillRect(roadRight - 5, 0, 5, h);

      const midX = roadLeft + laneW;
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 4;
      ctx.setLineDash([26, 24]);
      ctx.lineDashOffset = -state.roadOffset;
      ctx.beginPath();
      ctx.moveTo(midX, 0);
      ctx.lineTo(midX, h);
      ctx.stroke();
      ctx.setLineDash([]);

      if (state.mapMode === "mission") {
        const remM = Math.max(0, state.mission.targetM - state.distanceM);
        const gateY = h * 0.74 - remM * 1.1;
        if (gateY > -30 && gateY < h + 30) {
          ctx.fillStyle = "rgba(74, 222, 128, 0.25)";
          ctx.fillRect(roadLeft + 6, gateY - 8, roadW - 12, 16);
          ctx.strokeStyle = "#4ade80";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(roadLeft + 6, gateY);
          ctx.lineTo(roadRight - 6, gateY);
          ctx.stroke();
        }
      }

      state.npcs.forEach(npc => {
        const nx = roadLeft + laneW * (npc.lane + 0.5);
        ctx.save();
        ctx.translate(nx, npc.y);
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.beginPath();
        ctx.roundRect(-18, -26, 36, 54, 8);
        ctx.fill();

        ctx.fillStyle = npc.color;
        ctx.beginPath();
        ctx.roundRect(-16, -28, 32, 52, 7);
        ctx.fill();

        ctx.fillStyle = "#0f172a";
        ctx.fillRect(-12, -20, 24, 12);
        ctx.fillStyle = "#fef08a";
        ctx.fillRect(-12, 18, 7, 4);
        ctx.fillRect(5, 18, 7, 4);
        ctx.restore();
      });

      const px = roadLeft + laneW * (state.laneVisualX + 0.5);
      const py = h * 0.74;

      ctx.save();
      ctx.translate(px, py);

      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath();
      ctx.ellipse(0, 18, 16, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = sc.color;
      ctx.beginPath();
      ctx.roundRect(-8, -14, 16, 28, 5);
      ctx.fill();

      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-13, -10);
      ctx.lineTo(13, -10);
      ctx.stroke();

      ctx.fillStyle = "#f8fafc";
      ctx.beginPath();
      ctx.arc(0, -2, 7, 0, Math.PI * 2);
      ctx.fill();

      if (state.controls.brake) {
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(-7, 12, 14, 4);
      }

      ctx.restore();

      ctx.fillStyle = "rgba(15, 23, 42, 0.82)";
      ctx.beginPath();
      ctx.roundRect(10, 10, 235, 52, 10);
      ctx.fill();

      ctx.fillStyle = "#38bdf8";
      ctx.font = "bold 16px sans-serif";
      ctx.fillText(`${Math.round(state.speedKmh)} / ${sc.topSpeedKmh} km/h`, 20, 30);

      ctx.fillStyle = "#cbd5e1";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText(`Mesafe: ${Math.round(state.distanceM)}m • Şerit: ${state.lane === 0 ? "Sol" : "Sağ"} • NPC: ${state.npcs.length}`, 20, 49);

      if (state.flashMessage) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
        ctx.beginPath();
        ctx.roundRect(w / 2 - 140, 14, 280, 34, 10);
        ctx.fill();
        ctx.fillStyle = "#4ade80";
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(state.flashMessage, w / 2, 31);
        ctx.textAlign = "left";
      }
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      step(dt);
      drawRoad();
      requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    syncNpcControlUI();
    syncSoundBtnUI();
    renderHUD();
    renderGarage();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
